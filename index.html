<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arjun Kapadia | Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background: linear-gradient(-45deg, #2563eb, #7c3aed, #0891b2, #4f46e5);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
        min-height: 100vh;
      }
      @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      .glass {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .about-card {
        transition: all 0.3s ease;
        border-left: 4px solid #3b82f6;
      }
      .about-card:hover {
        transform: translateX(10px);
        background: rgba(59, 130, 246, 0.1);
      }
      /* Kid-friendly animations */
      @keyframes bounce-large {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-20px);
        }
      }
      @keyframes pulse-glow {
        0%,
        100% {
          box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        50% {
          box-shadow: 0 0 30px rgba(59, 130, 246, 1);
        }
      }
      @keyframes wiggle {
        0%,
        100% {
          transform: rotate(0deg);
        }
        25% {
          transform: rotate(-2deg);
        }
        75% {
          transform: rotate(2deg);
        }
      }
      .animate-bounce {
        animation: bounce-large 0.6s infinite;
      }
      .animate-pulse-glow {
        animation: pulse-glow 2s infinite;
      }
      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        -moz-appearance: textfield;
      }
    </style>
  </head>
  <body class="text-slate-200 font-sans">
    <nav class="glass sticky top-0 z-50 px-6 py-4 mb-8">
      <div class="container mx-auto flex justify-between items-center">
        <span class="text-2xl font-bold tracking-tighter text-blue-400"
          >AK</span
        >
        <div class="space-x-6 font-medium">
          <button
            onclick="showSection('about')"
            class="hover:text-blue-400 transition"
          >
            About Me
          </button>
          <button
            onclick="showSection('math')"
            class="hover:text-blue-400 transition"
          >
            Math Games
          </button>
        </div>
      </div>
    </nav>

    <div class="container mx-auto px-4 pb-20" id="content-container">
      <!-- Content will be loaded here -->
    </div>

    <script>
      let currentGame = null;
      let currentProblem = null;
      let score = 0;
      let streak = 0;
      let problemCount = 0;
      let answered = false;
      let answeredCorrectly = false;
      let currentSection = "about";

      // Sorting game state
      let sortingSelected = [];
      let sortingOriginal = [];
      let sortingCorrect = [];

      async function loadSection(sectionId) {
        const container = document.getElementById("content-container");
        const fileName = sectionId === "about" ? "about.html" : "math.html";

        try {
          const response = await fetch(fileName);
          const html = await response.text();
          container.innerHTML = html;
          currentSection = sectionId;
          window.scrollTo({ top: 0, behavior: "smooth" });
        } catch (error) {
          console.error("Error loading section:", error);
        }
      }

      function showSection(sectionId) {
        loadSection(sectionId);
      }

      function startMathGame(gameType) {
        currentGame = gameType;
        score = 0;
        streak = 0;
        problemCount = 0;
        answered = false;
        answeredCorrectly = false;

        document.getElementById("math-menu").classList.add("hidden");
        document.getElementById("math-game").classList.remove("hidden");
        document.getElementById("game-complete").classList.add("hidden");
        document.getElementById("game-active-area").classList.remove("hidden");
        document.getElementById("score").textContent = "0";
        document.getElementById("streak-count").textContent = "0";
        document.getElementById("streak").classList.add("hidden");

        generateNextProblem();
      }

      function generateNextProblem() {
        if (currentSection !== "math") return; // Prevent errors if user navigated away

        answered = false;
        answeredCorrectly = false;
        problemCount++;

        if (problemCount > 10) {
          showGameComplete();
          return;
        }

        document.getElementById("problem-number").textContent = problemCount;
        document.getElementById("feedback").classList.add("hidden");
        
        const answerInput = document.getElementById("answer-input");
        if (answerInput) {
          answerInput.value = "";
          answerInput.disabled = false;
          answerInput.style.background = "";
          if (currentGame !== "sorting") {
            answerInput.focus();
          }
        }

        const standardArea = document.getElementById("standard-game-area");
        const sortingArea = document.getElementById("sorting-game-area");

        if (currentGame === "sorting") {
          if (standardArea) standardArea.classList.add("hidden");
          if (sortingArea) sortingArea.classList.remove("hidden");
          
          generateSortingProblem();
        } else {
          if (sortingArea) sortingArea.classList.add("hidden");
          if (standardArea) standardArea.classList.remove("hidden");

          if (currentGame === "addition") {
            const num1 = Math.floor(Math.random() * 10) + 1; // 1-10
            const num2 = Math.floor(Math.random() * 10) + 1; // 1-10
            const answer = num1 + num2;
            currentProblem = { num1, num2, answer, type: "addition" };
            document.getElementById("num1").textContent = num1;
            document.getElementById("num2").textContent = num2;
            document.getElementById("operator").textContent = "+";
          } else {
            const num1 = Math.floor(Math.random() * 11) + 5; // 5-15
            const num2 = Math.floor(Math.random() * (num1 + 1)); // 0 to num1 inclusive
            const answer = num1 - num2;
            currentProblem = { num1, num2, answer, type: "subtraction" };
            document.getElementById("num1").textContent = num1;
            document.getElementById("num2").textContent = num2;
            document.getElementById("operator").textContent = "-";
          }
        }
      }

      function generateSortingProblem() {
        const numbers = [];
        while (numbers.length < 5) {
          const num = Math.floor(Math.random() * 90) + 10; // 10 to 99 (double digit)
          if (!numbers.includes(num)) {
            numbers.push(num);
          }
        }

        sortingOriginal = [...numbers];
        sortingCorrect = [...numbers].sort((a, b) => a - b);
        sortingSelected = [];

        renderSortingPool();
        renderSortingSlots();
        updateSortingCheckButton();
      }

      function renderSortingPool() {
        const pool = document.getElementById("sorting-pool");
        if (!pool) return;
        pool.innerHTML = "";

        sortingOriginal.forEach((num, index) => {
          const isSelected = sortingSelected.includes(index);
          const tile = document.createElement("button");
          
          tile.className = `w-20 h-20 md:w-24 md:h-24 rounded-2xl md:rounded-3xl flex items-center justify-center text-3xl md:text-4xl font-black transition-all transform hover:scale-105 active:scale-95 ${
            isSelected
              ? "bg-slate-700 text-slate-500 opacity-30 cursor-not-allowed pointer-events-none"
              : "bg-gradient-to-br from-yellow-300 to-amber-500 text-slate-900 shadow-lg hover:shadow-yellow-400/50 cursor-pointer"
          }`;
          tile.textContent = num;
          tile.onclick = () => {
            if (!isSelected && !answered) {
              selectSortingTile(index);
            }
          };
          pool.appendChild(tile);
        });
      }

      function renderSortingSlots() {
        const slotsContainer = document.getElementById("sorting-slots");
        if (!slotsContainer) return;
        slotsContainer.innerHTML = "";

        for (let i = 0; i < 5; i++) {
          const slot = document.createElement("button");
          const selectedIndex = sortingSelected[i];
          const hasValue = selectedIndex !== undefined;

          slot.className = `w-20 h-20 md:w-24 md:h-24 rounded-2xl md:rounded-3xl flex flex-col items-center justify-center text-3xl md:text-4xl font-black transition-all transform ${
            hasValue
              ? answered
                ? "bg-indigo-600 text-white cursor-not-allowed"
                : "bg-gradient-to-br from-cyan-400 to-blue-600 text-white shadow-lg hover:scale-105 hover:shadow-cyan-400/50 cursor-pointer active:scale-95"
              : "border-4 border-dashed border-slate-500/50 bg-slate-800/30 text-slate-500 pointer-events-none"
          }`;

          if (hasValue) {
            slot.textContent = sortingOriginal[selectedIndex];
            slot.onclick = () => {
              if (!answered) {
                deselectSortingSlot(i);
              }
            };
          } else {
            slot.innerHTML = `<span class="text-sm md:text-base font-bold text-slate-500">${i + 1}</span>`;
          }

          slotsContainer.appendChild(slot);
        }
      }

      function selectSortingTile(index) {
        if (sortingSelected.length < 5 && !sortingSelected.includes(index)) {
          sortingSelected.push(index);
          renderSortingPool();
          renderSortingSlots();
          updateSortingCheckButton();
        }
      }

      function deselectSortingSlot(slotIndex) {
        if (slotIndex >= 0 && slotIndex < sortingSelected.length) {
          sortingSelected.splice(slotIndex, 1);
          renderSortingPool();
          renderSortingSlots();
          updateSortingCheckButton();
        }
      }

      function updateSortingCheckButton() {
        const btn = document.getElementById("sorting-check-btn");
        if (btn) {
          btn.disabled = sortingSelected.length < 5;
        }
      }

      function submitSortingAnswer() {
        if (answered || sortingSelected.length < 5) return;
        answered = true;

        const userSorted = sortingSelected.map(index => sortingOriginal[index]);
        const isCorrect = userSorted.every((num, idx) => num === sortingCorrect[idx]);
        answeredCorrectly = isCorrect;

        const feedback = document.getElementById("feedback");
        const btn = document.getElementById("sorting-check-btn");
        if (btn) btn.disabled = true;

        const slots = document.getElementById("sorting-slots").children;

        if (isCorrect) {
          score++;
          streak++;
          document.getElementById("score").textContent = score;
          if (streak > 0) {
            document.getElementById("streak").classList.remove("hidden");
            document.getElementById("streak-count").textContent = streak;
          }

          feedback.innerHTML = "✅ Correct! Super Job! 🌟";
          feedback.style.color = "#4ade80";
          feedback.classList.remove("hidden");

          for (let i = 0; i < 5; i++) {
            slots[i].className = "w-20 h-20 md:w-24 md:h-24 rounded-2xl md:rounded-3xl flex items-center justify-center text-3xl md:text-4xl font-black bg-gradient-to-br from-green-400 to-emerald-600 text-slate-900 shadow-lg";
          }
        } else {
          streak = 0;
          document.getElementById("streak-count").textContent = "0";

          feedback.innerHTML = `❌ Oops! The correct order is: ${sortingCorrect.join(" → ")}`;
          feedback.style.color = "#f87171";
          feedback.classList.remove("hidden");

          for (let i = 0; i < 5; i++) {
            const isPosCorrect = userSorted[i] === sortingCorrect[i];
            if (isPosCorrect) {
              slots[i].className = "w-20 h-20 md:w-24 md:h-24 rounded-2xl md:rounded-3xl flex items-center justify-center text-3xl md:text-4xl font-black bg-gradient-to-br from-green-400 to-emerald-600 text-slate-900 shadow-lg";
            } else {
              slots[i].className = "w-20 h-20 md:w-24 md:h-24 rounded-2xl md:rounded-3xl flex items-center justify-center text-3xl md:text-4xl font-black bg-gradient-to-br from-red-400 to-rose-600 text-white shadow-lg animate-wiggle";
            }
          }
        }

        setTimeout(() => {
          generateNextProblem();
        }, 3000);
      }

      function submitAnswer() {
        const inputValue = document.getElementById("answer-input").value.trim();
        if (!inputValue) return;
        const selectedAnswer = parseInt(inputValue);
        checkAnswer(selectedAnswer);
      }

      function checkAnswer(selectedAnswer) {
        if (answered) return;

        answered = true;

        const userAnswer = Number(selectedAnswer);
        const correctAnswer = Number(currentProblem.answer);

        const isCorrect = userAnswer === correctAnswer;
        answeredCorrectly = isCorrect;

        const feedback = document.getElementById("feedback");
        document.getElementById("answer-input").disabled = true;

        if (isCorrect) {
          score++;
          streak++;
          document.getElementById("score").textContent = score;
          if (streak > 0) {
            document.getElementById("streak").classList.remove("hidden");
            document.getElementById("streak-count").textContent = streak;
          }

          feedback.innerHTML = "✅ Correct!";
          feedback.style.color = "#4ade80";
          feedback.classList.remove("hidden");
          document.getElementById("answer-input").style.background =
            "rgba(74, 222, 128, 0.3)";
        } else {
          streak = 0;
          document.getElementById("streak-count").textContent = "0";

          feedback.innerHTML = `❌ Oops! The answer is ${correctAnswer}`;
          feedback.style.color = "#f87171";
          feedback.classList.remove("hidden");
          document.getElementById("answer-input").style.background =
            "rgba(248, 113, 113, 0.3)";
        }

        setTimeout(() => {
          document.getElementById("answer-input").style.background = "";
          generateNextProblem();
        }, 2000);
      }

      const surpriseRewards = [
        {
          emoji: "🏆",
          title: "Math Champion!",
          message: "You're a true math master!",
        },
        {
          emoji: "🚀",
          title: "Math Rocket!",
          message: "You're flying high with math!",
        },
        {
          emoji: "👑",
          title: "Math King!",
          message: "You're royalty in the math world!",
        },
        {
          emoji: "⭐",
          title: "Super Star!",
          message: "You shine like a brilliant star!",
        },
        {
          emoji: "🦸",
          title: "Math Hero!",
          message: "You saved the day with perfect math!",
        },
        {
          emoji: "💎",
          title: "Diamond Mind!",
          message: "Your brain is a precious gem!",
        },
        {
          emoji: "🔥",
          title: "On Fire!",
          message: "You're burning up at math!",
        },
        {
          emoji: "🎪",
          title: "Math Genius!",
          message: "Your brain is absolutely genius!",
        },
        {
          emoji: "🌟",
          title: "Shining Bright!",
          message: "You're a mathematical supernova!",
        },
        {
          emoji: "🎯",
          title: "Bullseye!",
          message: "Perfect aim, perfect score!",
        },
        {
          emoji: "🏅",
          title: "Gold Medalist!",
          message: "You won the math Olympics!",
        },
        {
          emoji: "🎨",
          title: "Math Artist!",
          message: "You paint with numbers beautifully!",
        },
      ];

      function getRandomReward() {
        return surpriseRewards[
          Math.floor(Math.random() * surpriseRewards.length)
        ];
      }

      function showGameComplete() {
        document.getElementById("game-active-area").classList.add("hidden");
        document.getElementById("game-complete").classList.remove("hidden");
        document.getElementById("final-score").textContent = score;

        if (score === 10) {
          const reward = getRandomReward();
          document.getElementById("reward-emoji").textContent = "🎁";
          document.getElementById("reward-display").textContent = reward.emoji;
          document.getElementById("reward-message").textContent =
            reward.message;

          document.getElementById("perfect-reward").classList.remove("hidden");
          document.getElementById("normal-complete").classList.add("hidden");
        } else {
          document.getElementById("perfect-reward").classList.add("hidden");
          document.getElementById("normal-complete").classList.remove("hidden");
        }
      }

      function backToMathMenu() {
        document.getElementById("math-game").classList.add("hidden");
        document.getElementById("math-menu").classList.remove("hidden");
        document.getElementById("game-active-area").classList.remove("hidden");
        const answerInput = document.getElementById("answer-input");
        if (answerInput) {
          answerInput.style.background = "";
          answerInput.value = "";
        }
        document.getElementById("game-complete").classList.add("hidden");
        currentGame = null;
        currentProblem = null;
        answered = false;

        sortingSelected = [];
        sortingOriginal = [];
        sortingCorrect = [];
      }

      // Load the about section on page load
      window.addEventListener("DOMContentLoaded", () => {
        loadSection("about");
      });
    </script>
  </body>
</html>
